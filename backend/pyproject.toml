[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Por defecto la suite corre offline. Las pruebas de integración contra Supabase real
# se ejecutan explícitamente con: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: requiere Supabase real y red (credenciales en .env)",
]
