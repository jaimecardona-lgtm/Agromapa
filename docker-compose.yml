version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agromapa-backend
    environment:
      APP_NAME: AgroMapa Colombia API
      APP_ENV: development
      APP_DEBUG: 'true'
      API_V1_PREFIX: /api
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:3000
      # Supabase configuration (leave empty for development without remote DB)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      OPENROUTER_ENABLED: 'false'
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agromapa-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev
